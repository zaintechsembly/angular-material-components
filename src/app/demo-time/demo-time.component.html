<h2>See <a [routerLink]="['/datetimepicker']">API Datetime-picker</a> for more details</h2>

<div class="zone zone-value" style="padding: 16px; margin: 16px; border: 1px solid #ddd; border-radius: 4px;">
  <h3>Selected date: {{date?.toLocaleString()}}</h3>
</div>

<div class="zone zone-picker" style="padding: 16px; margin: 16px; border: 1px solid #ddd; border-radius: 4px;">
  <ngx-mat-timepicker [(ngModel)]="date" [disabled]="disabled" [showSpinners]="showSpinners" [stepHour]="stepHour"
    [stepMinute]="stepMinute" [stepSecond]="stepSecond" [showSeconds]="showSeconds" [color]="color"
    [enableMeridian]="enableMeridian" [disableMinute]="disableMinute">
  </ngx-mat-timepicker>
</div>

<div class="zone zone-config" style="padding: 16px; margin: 16px; border: 1px solid #ddd; border-radius: 4px;">
  <div class="config-wrapper" style="margin: 8px 0;">
    <label>
      <input type="checkbox" [(ngModel)]="disabled" style="margin-right: 8px;">
      disabled (Default: false)
    </label>
  </div>

  <div class="config-wrapper" style="margin: 8px 0;">
    <label>
      <input type="checkbox" [(ngModel)]="showSpinners" style="margin-right: 8px;">
      showSpinners (Default: true)
    </label>
  </div>

  <div class="config-wrapper" style="margin: 8px 0;">
    <label>
      <input type="checkbox" [(ngModel)]="showSeconds" style="margin-right: 8px;">
      showSeconds (Default: false)
    </label>
  </div>

  <div class="config-wrapper" style="margin: 8px 0;">
    <label>
      <input type="checkbox" [(ngModel)]="disableMinute" style="margin-right: 8px;">
      disableMinute (Default: false)
    </label>
  </div>

  <div class="config-wrapper" style="margin: 8px 0;">
    <label>
      <input type="checkbox" [(ngModel)]="enableMeridian" style="margin-right: 8px;">
      enableMeridian (Default: false)
    </label>
  </div>

  <div class="config-wrapper config-wrapper_step" style="margin: 16px 0;">
    <span class="label">Steps: </span>
    <div style="display: flex; gap: 16px; align-items: center;">
      <div>
        <label>Hour (default: 1):</label>
        <select [(ngModel)]="stepHour" style="margin-left: 8px; padding: 4px;">
          <option *ngFor="let step of stepHours" [value]="step">{{step}}</option>
        </select>
      </div>
      <div>
        <label>Minute (default: 1):</label>
        <select [(ngModel)]="stepMinute" style="margin-left: 8px; padding: 4px;">
          <option *ngFor="let step of stepMinutes" [value]="step">{{step}}</option>
        </select>
      </div>
      <div>
        <label>Second (default: 1):</label>
        <select [(ngModel)]="stepSecond" style="margin-left: 8px; padding: 4px;">
          <option *ngFor="let step of stepSeconds" [value]="step">{{step}}</option>
        </select>
      </div>
    </div>
  </div>

  <div class="config-wrapper" style="margin: 8px 0;">
    <label>Color (Default: primary):</label>
    <select [(ngModel)]="color" style="margin-left: 8px; padding: 4px;">
      <option *ngFor="let item of listColors" [value]="item">{{item}}</option>
    </select>
  </div>
</div>

<pre><code ngxMatHighlight class="language-html">{{codeTimePicker}}</code></pre>
